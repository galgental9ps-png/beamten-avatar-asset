name: Publish Assets 40 Buchbindertag
on:
  push:
    branches: [main]
    paths:
      - .asset-publisher/40/ready
permissions:
  contents: write
jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Reconstruct, validate, publish atomically, and revalidate origin/main
        run: python .asset-publisher/40/publisher.py
