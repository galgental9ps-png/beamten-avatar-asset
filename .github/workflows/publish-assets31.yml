name: Publish Assets 31 Apfeltag

on:
  push:
    branches: [main]
    paths:
      - ".asset-publisher/31/**"
      - ".github/workflows/publish-assets31.yml"

permissions:
  contents: write

concurrency:
  group: publish-assets31
  cancel-in-progress: false

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Reconstruct, validate, publish, and reverify origin/main
        id: publish
        run: python .asset-publisher/31/publish.py
      - name: Record verified commit
        run: echo "Verified Assets 31 at ${{ steps.publish.outputs.asset_sha }}"
