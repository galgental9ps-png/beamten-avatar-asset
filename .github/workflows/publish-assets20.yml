name: Publish Assets 20 Museumstag

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-assets20.yml

permissions:
  contents: write

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Materialize validate publish and verify origin main
        run: python .asset-publisher/20/publish.py
