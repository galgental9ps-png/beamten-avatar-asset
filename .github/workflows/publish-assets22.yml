name: Publish Assets 22 Schachtag

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-assets22.yml

permissions:
  contents: write

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Materialize, validate, publish, and verify Assets 22
        run: python .asset-publisher/22/publish.py
