name: Publish Assets 28 once

on:
  push:
    branches: [main]
    paths:
      - '.asset-publisher/28/**'
      - '.github/workflows/publish-assets28.yml'

permissions:
  contents: write

jobs:
  publish-and-reverify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Reconstruct, validate, commit and push
        run: python .asset-publisher/28/publish.py
      - name: Fetch published main and reverify
        run: |
          git fetch origin main
          git reset --hard origin/main
          python .asset-publisher/28/publish.py --verify-only
