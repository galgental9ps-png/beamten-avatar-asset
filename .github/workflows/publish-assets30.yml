name: Publish Assets 30 Drachentag

on:
  push:
    branches: [main]
    paths:
      - '.asset-publisher/30/**'
      - '.github/workflows/publish-assets30.yml'

permissions:
  contents: write

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Reconstruct, validate, publish and reverify origin/main
        run: python .asset-publisher/30/publish.py
