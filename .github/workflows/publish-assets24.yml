name: Publish Assets 24 Werkstatttag

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-assets24.yml

permissions:
  contents: write

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - name: Materialize, validate, publish, and verify Assets 24
        run: python .asset-publisher/24/publish.py
