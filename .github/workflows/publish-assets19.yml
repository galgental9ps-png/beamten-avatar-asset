name: Publish Assets 19 once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-assets19.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Materialize the four new illustrations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p 'BeamtenMonitorAvatar/Assets 19/Avatar' 'BeamtenMonitorAvatar/Assets 19/MonitorScene' 'BeamtenMonitorAvatar/Assets 19/Klingel'
          cat .asset-publisher/19/idle/part-* | base64 --decode > 'BeamtenMonitorAvatar/Assets 19/Avatar/Idle.png'
          cat .asset-publisher/19/actions/part-* | base64 --decode > 'BeamtenMonitorAvatar/Assets 19/Avatar/Actions.png'
          cat .asset-publisher/19/scene/part-* | base64 --decode > 'BeamtenMonitorAvatar/Assets 19/MonitorScene/MonitorScene.png'
          cat .asset-publisher/19/bell/part-* | base64 --decode > 'BeamtenMonitorAvatar/Assets 19/Klingel/MonitorBell.png'
          python .asset-publisher/19/publish.py --write-json
      - name: Validate before publication
        run: python .asset-publisher/19/publish.py
      - name: Commit all five asset files atomically
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'beamten-asset-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- 'BeamtenMonitorAvatar/Assets 19/Avatar/Idle.png' 'BeamtenMonitorAvatar/Assets 19/Avatar/Actions.png' 'BeamtenMonitorAvatar/Assets 19/MonitorScene/MonitorScene.png' 'BeamtenMonitorAvatar/Assets 19/Klingel/MonitorBell.png' 'BeamtenMonitorAvatar/Assets 19/Sprüche/Abschiedsspruch.json'
          test "$(git diff --cached --name-only | wc -l)" -eq 5
          git commit -m 'Assets 19: Apothekentag Asset-Set'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push origin HEAD:main
      - name: Re-read origin main and verify published bytes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          test "$(git rev-parse HEAD)" = '${{ steps.commit.outputs.sha }}'
          python .asset-publisher/19/publish.py
