name: Publish Assets 33 Schneidertag

on:
  push:
    branches: [main]
    paths:
      - ".asset-publisher/33/**"
      - ".github/workflows/publish-assets33.yml"

permissions:
  contents: write

concurrency:
  group: publish-assets33
  cancel-in-progress: false

jobs:
  publish-and-reverify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Generate, validate, publish, and verify origin/main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python .asset-publisher/33/publish.py
